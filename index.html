<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guest@terminal:~</title>
    <meta property="og:title" content="Andrii Borodin - Terminal Portfolio">
    <meta property="og:description" content="Interactive CLI resume. Type 'help' to execute commands.">
    <meta property="og:image" content="https://andriiborodin.github.io/preview.png">
    <meta property="og:url" content="https://andriiborodin.github.io/">
    <meta property="og:type" content="website">
    <style>
        :root {
            --bg-color: #0d1117; 
            --text-color: #00ff41; 
            --cmd-color: #f0f6fc; 
            --error-color: #ff5555; 
            --prompt-color: #2f81f7;
            --link-color: #d2a8ff;
            --desc-color: #8b949e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            font-size: 16px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        #terminal { 
            max-width: 900px; 
            margin: 0 auto;
            position: relative;
        }

        #static-header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding-bottom: 10px;
            padding-top: 10px;
            z-index: 100;
            border-bottom: 1px solid #30363d;
        }
        
        .output p, .output div { margin: 5px 0; white-space: pre-wrap; }
        
        .command-line { display: flex; align-items: center; margin-top: 10px; }
        .prompt { color: var(--prompt-color); margin-right: 10px; white-space: nowrap; }
        
        input {
            background: transparent; border: none; color: var(--cmd-color);
            font-family: inherit; font-size: inherit; flex-grow: 1; outline: none;
        }
        
        a { color: var(--link-color); text-decoration: none; border-bottom: 1px dashed var(--link-color); }
        a:hover { background: var(--link-color); color: var(--bg-color); }

        .highlight { color: #d2a8ff; font-weight: bold; }
        .section-title { color: #79c0ff; font-weight: bold; text-decoration: underline; margin-top: 25px; margin-bottom: 15px; display: block;}

        .help-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .help-table td {
            vertical-align: top;
            padding-bottom: 5px;
        }
        .help-cmd { 
            color: var(--text-color); 
            font-weight: bold; 
            width: 100px; 
            white-space: nowrap;
        }
        .help-desc { 
            color: var(--desc-color); 
        }

        .job-block {
            display: flex;
            margin-bottom: 10px;
        }
        .job-dash {
            min-width: 20px;
            font-weight: bold;
        }
        .job-desc { flex: 1; }

        .info-block {
            display: flex;
            margin-bottom: 5px;
        }
        .info-label {
            min-width: 110px; 
            font-weight: bold;
            color: #d2a8ff;
        }
        .info-val {
            flex: 1;
        }

        .thm-badge {
            margin-top: 20px;
            margin-bottom: 0;
            display: block;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        .action-chip {
            background: #161b22;
            border: 1px solid #30363d;
            color: var(--text-color);
            padding: 4px 10px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s ease;
            user-select: none;
        }

        .action-chip:hover {
            background: #21262d;
            border-color: var(--text-color);
            color: #fff;
        }

        .action-chip:active {
            transform: scale(0.96);
        }

        #matrix-canvas {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: black;
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div id="terminal">
    <div id="static-header">
        <p>Last login: <span id="date-time"></span> on ttys000</p>
        <p>Welcome to <span class="highlight">Andrii Borodin's Terminal</span></p>
        <p>Role: <span class="highlight">Software Test Engineer / Penetration Tester</span></p>
        <p>Type <span class="highlight">'help'</span> to see available commands.</p>
    </div>

    <div id="output"></div>

    <div class="command-line">
        <span class="prompt">guest@terminal:~$</span>
        <input type="text" id="commandInput" autocomplete="off" autofocus>
    </div>

    <div class="quick-actions" id="quickActions">
        <button type="button" class="action-chip" data-cmd="help">help</button>
        <button type="button" class="action-chip" data-cmd="whoami">whoami</button>
        <button type="button" class="action-chip" data-cmd="skills">skills</button>
        <button type="button" class="action-chip" data-cmd="contact">contact</button>
        <button type="button" class="action-chip" data-cmd="matrix">matrix</button>
        <button type="button" class="action-chip" data-cmd="clear">clear</button>
    </div>
</div>

<script>
    const input = document.getElementById('commandInput');
    const output = document.getElementById('output');
    const header = document.getElementById('static-header');
    const matrixCanvas = document.getElementById('matrix-canvas');

    // Supported commands list for tab completion & quick actions
    const COMMANDS = ['help', 'whoami', 'skills', 'experience', 'certs', 'contact', 'github', 'matrix', 'clear', 'resume', 'cv'];

    // Command History State
    const history = [];
    let historyIndex = -1;

    document.getElementById('date-time').innerText = new Date().toLocaleString();
    
    document.addEventListener('click', (e) => {
        if (!e.target.closest('a') && !e.target.closest('.action-chip')) {
            input.focus();
        }
    });

    // Quick action buttons click listener
    document.getElementById('quickActions').addEventListener('click', (e) => {
        const btn = e.target.closest('.action-chip');
        if (!btn) return;
        const cmd = btn.getAttribute('data-cmd');
        if (cmd) {
            input.value = cmd;
            handleCommandSubmit(cmd);
        }
    });

    // Keyboard handlers (Enter, ArrowUp, ArrowDown, Tab)
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const raw = input.value;
            const command = raw.trim().toLowerCase();
            if (raw.trim()) {
                history.push(raw);
                historyIndex = history.length;
            }
            input.value = '';
            processCommand(command);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (history.length > 0 && historyIndex > 0) {
                historyIndex--;
                input.value = history[historyIndex];
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIndex < history.length - 1) {
                historyIndex++;
                input.value = history[historyIndex];
            } else {
                historyIndex = history.length;
                input.value = '';
            }
        } else if (e.key === 'Tab') {
            e.preventDefault();
            const current = input.value.trim().toLowerCase();
            if (!current) return;
            const matches = COMMANDS.filter(c => c.startsWith(current));
            if (matches.length === 1) {
                input.value = matches[0];
            } else if (matches.length > 1) {
                // Show matching options in terminal
                const hintLine = document.createElement('div');
                hintLine.innerHTML = `<p style="color:var(--desc-color)">${matches.join('   ')}</p>`;
                output.appendChild(hintLine);
                window.scrollTo(0, document.body.scrollHeight);
            }
        }
    });

    function handleCommandSubmit(cmd) {
        history.push(cmd);
        historyIndex = history.length;
        input.value = '';
        processCommand(cmd);
    }

    // Matrix Rain Effect
    let matrixInterval = null;
    function startMatrix() {
        matrixCanvas.style.display = 'block';
        const ctx = matrixCanvas.getContext('2d');
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;

        const letters = '0123456789ABCDEF0101010101ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*';
        const fontSize = 16;
        const columns = Math.floor(matrixCanvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        matrixInterval = setInterval(draw, 33);

        const stopMatrix = () => {
            clearInterval(matrixInterval);
            matrixCanvas.style.display = 'none';
            window.removeEventListener('keydown', onKey);
            matrixCanvas.removeEventListener('click', stopMatrix);
        };
        const onKey = (e) => {
            if (e.key === 'Escape' || e.key === 'q' || e.key === 'Enter') {
                stopMatrix();
            }
        };

        window.addEventListener('keydown', onKey);
        matrixCanvas.addEventListener('click', stopMatrix);
    }

        const historyLine = document.createElement('div');

  <tr><td class="help-cmd">github</td><td class="help-desc">Open GitHub profile in new tab</td></tr>

            case '':

            default:

        }

        if (response) {
            const respLine = document.createElement('div');
            respLine.innerHTML = response;
            output.appendChild(respLine);

            if (cmd === 'whoami' || cmd === 'cv' || cmd === 'resume') {
                const headerHeight = header.offsetHeight;
                const elementPosition = respLine.getBoundingClientRect().top + window.scrollY;

                    top: elementPosition - headerHeight - 10,

                });
            } else {
